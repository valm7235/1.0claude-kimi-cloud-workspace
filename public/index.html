<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Kimi Cloud</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #1e293b;
    padding: 12px 16px;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1rem; }
  #status { font-size: 0.75rem; color: #94a3b8; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 90%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 0.95rem; word-wrap: break-word; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
  .bot { align-self: flex-start; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-bottom-left-radius: 2px; }
  #input-area {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #334155;
    background: #1e293b;
  }
  #msgInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
  }
  #sendBtn {
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #f87171; font-size: 0.85rem; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Claude Kimi Cloud</h1>
  <div id="status">Connexion...</div>
</header>
<div id="chat"></div>
<div id="input-area">
  <input id="msgInput" type="text" placeholder="Ecrire un message..." autocomplete="off">
  <button id="sendBtn">Envoyer</button>
</div>
<script>
  const chat = document.getElementById('chat');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  const history = [];

  async function checkHealth() {
    try {
      const r = await fetch('/health');
      const d = await r.json();
      status.textContent = 'Pret — ' + d.model;
      status.style.color = '#4ade80';
    } catch (e) {
      status.textContent = 'Hors ligne';
      status.style.color = '#f87171';
    }
  }
  checkHealth();
  setInterval(checkHealth, 30000);

  function append(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = msgInput.value.trim();
    if (!text) return;
    append('user', text);
    msgInput.value = '';
    sendBtn.disabled = true;
    history.push({ role: 'user', content: text });

    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });
      const d = await r.json();
      if (d.error) {
        append('bot', 'Erreur : ' + d.error);
      } else {
        append('bot', d.reply);
        history.push({ role: 'assistant', content: d.reply });
      }
    } catch (e) {
      append('bot', 'Erreur reseau : ' + e.message);
    }
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }

  sendBtn.addEventListener('click', send);
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
